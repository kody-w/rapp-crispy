name: RAPPCrispy
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
packages:
  RAPPDesktopSupport:
    url: https://github.com/kody-w/rapp-tools.git
    revision: f0bc616c2aed34f2a88888806ed056ec7bafba61
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.5.1"
    CURRENT_PROJECT_VERSION: "151"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  RAPPCrispyCore:
    type: framework
    platform: macOS
    sources:
      - Sources/RAPPCrispyCore
    dependencies:
      - package: RAPPDesktopSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.crispy.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  RAPPCrispy:
    type: application
    platform: macOS
    sources:
      - Sources/RAPPCrispy
      - path: Resources
        excludes:
          - Info.plist
          - runtime
        buildPhase: resources
      - path: Resources/runtime
        type: folder
        buildPhase: resources
    dependencies:
      - target: RAPPCrispyCore
      - package: RAPPDesktopSupport
    settings:
      base:
        PRODUCT_NAME: RAPPCrispy
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.crispy
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Signing/RAPPCrispy.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  RAPPCrispyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/RAPPCrispyCoreTests
    dependencies:
      - target: RAPPCrispyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.rapp.crispy.core.tests
schemes:
  RAPPCrispy:
    build:
      targets:
        RAPPCrispy: all
    test:
      targets:
        - RAPPCrispyCoreTests
